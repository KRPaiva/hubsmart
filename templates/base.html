<!doctype html>
<html lang="pt-BR" class="h-full bg-slate-50">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HubSmart Brainstorm{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) window.lucide.createIcons();
      });
      document.addEventListener("htmx:afterSwap", () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </head>
  <body class="min-h-full text-slate-900 antialiased">
    {% block content %}{% endblock %}
  </body>
</html>
